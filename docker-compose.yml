services:
  bayora-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayora-secure-testing-platform
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    volumes:
      - audit-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  audit-data:
    driver: local
