version: '3.8'

services:
  bayora-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayora-secure-testing-platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
