name: Bayora Architecture CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test Coverage & Smoke Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies (5 moderate dev findings noted in nyc toolchain)
      run: npm audit --omit=dev --audit-level=moderate

    - name: Run ESLint
      run: npm run lint

    - name: Run Test Suite with Full Code Coverage
      run: npm run test:coverage

    - name: Smoke test Express API Server & Benchmark Registry
      run: |
        node src/server.js &
        SERVER_PID=$!
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:3000/api/status > /dev/null 2>&1; then
            echo "Server ready after attempt $i"
            break
          fi
          sleep 0.5
        done
        curl --fail http://127.0.0.1:3000/api/status
        curl --fail http://127.0.0.1:3000/api/datasets
        kill $SERVER_PID
