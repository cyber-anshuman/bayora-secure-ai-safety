name: Bayora Architecture CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: PoC Tests & Adversarial Simulations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies for high/critical security vulnerabilities
      run: npm audit --audit-level=high

    - name: Run Section S PoC Verification Suite (9 Claims)
      run: npm test

    - name: Run Subsystems & Weight Integrity Unit Tests
      run: npm run test:unit

    - name: Run Real Runtime Isolation Unit Tests (worker_threads, Section H partial)
      run: npm run test:isolation

    - name: Run Section T Adversarial Attack Simulations (7 Scenarios)
      run: npm run test:attacks

    - name: Verify Code Test Coverage (>90%)
      run: npm run test:coverage

    - name: Smoke test Express API Server & Benchmark Registry
      run: |
        node src/server.js &
        SERVER_PID=$!
        sleep 3
        curl --fail http://localhost:3000/api/status
        curl --fail http://localhost:3000/api/datasets
        kill $SERVER_PID
